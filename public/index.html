<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
<title>Nearline — Chat</title>
<script src="/socket.io/socket.io.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');

  :root{
    --bg-0:#08090c; --bg-1:#12141a;
    --glass:rgba(255,255,255,0.055); --glass-strong:rgba(255,255,255,0.10);
    --glass-border:rgba(255,255,255,0.13); --glass-border-soft:rgba(255,255,255,0.07);
    --ink:#e9edf3; --ink-dim:#8b93a3; --ink-faint:#5b6272;
    --accent:#b9c8dc; --accent-glow:rgba(185,200,220,0.35);
    --sent:rgba(255,255,255,0.13); --sent-border:rgba(255,255,255,0.22);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  :root{--app-height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(ellipse 700px 500px at 15% 8%, rgba(120,140,170,0.16), transparent 60%),
      radial-gradient(ellipse 600px 500px at 90% 85%, rgba(90,105,135,0.14), transparent 60%),
      linear-gradient(180deg, var(--bg-0), var(--bg-1));
    font-family:'Inter', -apple-system, sans-serif; color:var(--ink);
    display:flex; align-items:center; justify-content:center; min-height:100vh; overflow:hidden;
  }
  .orb{ position:fixed; border-radius:50%; filter:blur(60px); pointer-events:none; z-index:0; animation:drift 22s ease-in-out infinite;}
  .orb1{width:340px; height:340px; background:rgba(140,160,190,0.16); top:-100px; left:-80px;}
  .orb2{width:280px; height:280px; background:rgba(100,115,145,0.14); bottom:-80px; right:-60px; animation-delay:-9s;}
  @keyframes drift{ 0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(24px,-18px) scale(1.06);} }

  .frame{
    position:relative; z-index:1; width:100%; max-width:420px; height:var(--app-height); max-height:900px;
    background:linear-gradient(160deg, rgba(255,255,255,0.05), rgba(255,255,255,0.015));
    border:1px solid var(--glass-border-soft); border-radius:38px;
    box-shadow:0 40px 90px -30px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255,255,255,0.06);
    backdrop-filter:blur(30px); -webkit-backdrop-filter:blur(30px);
    overflow:hidden; display:flex; flex-direction:column;
  }
  @media (max-width:480px){ .frame{ max-width:100%; height:100vh; max-height:none; border-radius:0; border:none;} }

  .screen{ display:flex; flex-direction:column; height:100%; }
  .onboard{ padding:32px 26px; justify-content:center; gap:0; overflow-y:auto; }
  .brand-mark{
    width:52px; height:52px; border-radius:16px; background:var(--glass-strong); border:1px solid var(--glass-border);
    display:flex; align-items:center; justify-content:center; margin-bottom:20px;
    box-shadow:0 0 0 1px rgba(255,255,255,0.02), 0 12px 30px -10px rgba(0,0,0,0.5);
  }
  .brand-mark::before{
    content:''; width:16px; height:16px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #dfe6ee, var(--accent) 70%);
    box-shadow:0 0 16px var(--accent-glow);
  }
  .onboard h1{ font-family:'Space Grotesk', sans-serif; font-weight:600; font-size:27px; margin:0 0 6px; letter-spacing:-0.02em; }
  .onboard p.sub{ color:var(--ink-dim); font-size:13.5px; margin:0 0 26px; line-height:1.5; max-width:290px; }
  .field-label{ font-family:'JetBrains Mono', monospace; font-size:10.5px; letter-spacing:0.12em; text-transform:uppercase; color:var(--ink-faint); margin:0 0 8px; display:block; }
  .glass-input{
    width:100%; padding:13px 16px; margin-bottom:16px; background:var(--glass); border:1px solid var(--glass-border-soft);
    border-radius:14px; color:var(--ink); font-family:'Inter',sans-serif; font-size:15px; outline:none; transition:border-color .2s, background .2s;
  }
  .glass-input:focus{ border-color:var(--glass-border); background:var(--glass-strong); }
  .glass-input::placeholder{ color:var(--ink-faint); }
  .row-gap{ display:flex; gap:10px; margin-bottom:8px; }
  .btn{
    font-family:'Space Grotesk', sans-serif; font-weight:500; font-size:14.5px; padding:14px 18px; border-radius:14px;
    border:1px solid var(--glass-border); background:var(--glass); color:var(--ink); cursor:pointer;
    transition:transform .15s, background .2s, border-color .2s; flex:1; text-align:center;
  }
  .btn:active{ transform:scale(0.97); }
  .btn.primary{
    background:linear-gradient(160deg, rgba(255,255,255,0.20), rgba(255,255,255,0.08));
    border-color:rgba(255,255,255,0.28); box-shadow:0 10px 26px -10px rgba(255,255,255,0.12);
  }
  .btn:disabled{ opacity:0.4; cursor:not-allowed; }
  .status-line{ margin-top:10px; font-family:'JetBrains Mono', monospace; font-size:11.5px; color:var(--ink-faint); display:flex; align-items:center; gap:6px; min-height:16px; }
  .status-dot{ width:6px; height:6px; border-radius:50%; background:var(--ink-faint); flex-shrink:0; }
  .status-dot.ok{ background:#8fe3b0; box-shadow:0 0 8px rgba(143,227,176,0.7); }
  .status-dot.bad{ background:#e38f8f; box-shadow:0 0 8px rgba(227,143,143,0.7); }

  .chat-header{ display:flex; align-items:center; gap:12px; padding:16px 20px; border-bottom:1px solid var(--glass-border-soft); background:rgba(255,255,255,0.02); backdrop-filter:blur(10px); }
  .avatar-ring{ width:38px; height:38px; border-radius:50%; background:var(--glass-strong); border:1px solid var(--glass-border); display:flex; align-items:center; justify-content:center; font-family:'Space Grotesk', sans-serif; font-weight:600; font-size:14px; flex-shrink:0; }
  .chat-header .meta{ flex:1; min-width:0; }
  .chat-header .room-code{ font-family:'JetBrains Mono', monospace; font-size:13.5px; letter-spacing:0.06em; }
  .presence-line{ font-size:11.5px; color:var(--ink-faint); display:flex; align-items:center; gap:6px; margin-top:2px; }
  .dot{ width:6px; height:6px; border-radius:50%; background:#8fe3b0; box-shadow:0 0 8px rgba(143,227,176,0.7); animation:pulse 2s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:0.4;} }
  .leave-btn{ background:none; border:none; color:var(--ink-faint); font-size:12px; cursor:pointer; font-family:'JetBrains Mono', monospace; padding:6px 8px; border-radius:8px; }
  .leave-btn:hover{ color:var(--ink); background:var(--glass); }

  .messages{ flex:1; overflow-y:auto; padding:18px 16px; display:flex; flex-direction:column; gap:12px; scroll-behavior:smooth; }
  .messages::-webkit-scrollbar{ width:4px; }
  .messages::-webkit-scrollbar-thumb{ background:rgba(255,255,255,0.12); border-radius:4px; }
  .msg-row{ display:flex; gap:8px; max-width:88%; animation:rise .28s ease; }
  @keyframes rise{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
  .msg-row.mine{ align-self:flex-end; flex-direction:row-reverse; }
  .msg-avatar{ width:26px; height:26px; border-radius:50%; flex-shrink:0; margin-top:auto; background:var(--glass); border:1px solid var(--glass-border-soft); display:flex; align-items:center; justify-content:center; font-size:10px; font-family:'Space Grotesk',sans-serif; font-weight:600; color:var(--ink-dim); }
  .bubble-wrap{ display:flex; flex-direction:column; gap:3px; }
  .msg-row.mine .bubble-wrap{ align-items:flex-end; }
  .sender-name{ font-size:10.5px; color:var(--ink-faint); font-family:'JetBrains Mono', monospace; margin-left:2px; }
  .bubble{ padding:10px 14px; border-radius:16px; font-size:14.5px; line-height:1.45; background:var(--glass); border:1px solid var(--glass-border-soft); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); word-wrap:break-word; white-space:pre-wrap; }
  .msg-row.mine .bubble{ background:var(--sent); border-color:var(--sent-border); border-bottom-right-radius:5px; }
  .msg-row:not(.mine) .bubble{ border-bottom-left-radius:5px; }
  .ts{ font-size:9.5px; color:var(--ink-faint); font-family:'JetBrains Mono', monospace; margin:0 3px; }
  .system-msg{ text-align:center; font-size:11px; color:var(--ink-faint); font-family:'JetBrains Mono', monospace; margin:2px 0; }
  .typing-line{ font-size:11px; color:var(--ink-faint); font-family:'JetBrains Mono', monospace; padding:0 20px 6px; min-height:16px; }

  .empty-state{ margin:auto; text-align:center; color:var(--ink-faint); padding:30px; }
  .empty-state .glyph{ width:44px; height:44px; margin:0 auto 14px; border-radius:14px; background:var(--glass); border:1px solid var(--glass-border-soft); display:flex; align-items:center; justify-content:center; font-size:18px; }
  .empty-state p{ font-size:13px; line-height:1.5; max-width:220px; margin:0 auto; }

  .composer{ display:flex; align-items:flex-end; gap:8px; padding:14px 14px calc(14px + env(safe-area-inset-bottom)); border-top:1px solid var(--glass-border-soft); background:rgba(255,255,255,0.02); }
  .composer-input{ flex:1; resize:none; max-height:110px; min-height:22px; background:var(--glass); border:1px solid var(--glass-border-soft); border-radius:20px; padding:11px 16px; color:var(--ink); font-family:'Inter',sans-serif; font-size:14.5px; outline:none; line-height:1.4; }
  .composer-input:focus{ border-color:var(--glass-border); }
  .send-btn{ width:42px; height:42px; border-radius:50%; flex-shrink:0; background:linear-gradient(160deg, rgba(255,255,255,0.22), rgba(255,255,255,0.08)); border:1px solid rgba(255,255,255,0.26); color:var(--ink); display:flex; align-items:center; justify-content:center; cursor:pointer; transition:transform .15s; }
  .send-btn:active{ transform:scale(0.92); }
  .send-btn:disabled{ opacity:0.35; }

  .toast{ position:absolute; top:14px; left:50%; transform:translateX(-50%); background:rgba(20,22,28,0.9); border:1px solid var(--glass-border); padding:8px 16px; border-radius:20px; font-size:12px; color:var(--ink); backdrop-filter:blur(10px); opacity:0; transition:opacity .3s, transform .3s; pointer-events:none; z-index:10; font-family:'JetBrains Mono', monospace; text-align:center; max-width:80%; }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(4px); }
</style>
</head>
<body>

<div class="orb orb1"></div>
<div class="orb orb2"></div>

<div class="frame" id="frame">
  <div class="toast" id="toast"></div>

  <div class="screen onboard" id="onboardScreen">
    <div class="brand-mark"></div>
    <h1>Nearline</h1>
    <p class="sub">Real-time chat over the internet. Point this at your server, pick a room, share the code.</p>

    <span class="field-label">Server URL</span>
    <input class="glass-input" id="serverInput" placeholder="https://your-app.onrender.com" style="font-family:'JetBrains Mono',monospace; font-size:13px;" />

    <span class="field-label">Your name</span>
    <input class="glass-input" id="nameInput" placeholder="e.g. Riya" maxlength="24" />

    <span class="field-label">Room code</span>
    <input class="glass-input" id="roomInput" placeholder="e.g. AXQ294" maxlength="12" style="font-family:'JetBrains Mono',monospace; letter-spacing:0.06em; text-transform:uppercase;" />

    <div class="row-gap" style="margin-top:4px;">
      <button class="btn primary" id="joinBtn">Connect &amp; join</button>
      <button class="btn" id="createBtn">New room</button>
    </div>
    <div class="status-line"><span class="status-dot" id="statusDot"></span><span id="statusText">not connected</span></div>
  </div>

  <div class="screen" id="chatScreen" style="display:none;">
    <div class="chat-header">
      <div class="avatar-ring" id="myAvatar"></div>
      <div class="meta">
        <div class="room-code" id="roomLabel"></div>
        <div class="presence-line"><span class="dot"></span><span id="presenceText">connecting…</span></div>
        <div class="presence-line" style="margin-top:1px;">🔒 <span id="encStatus">encrypting…</span></div>
      </div>
      <button class="leave-btn" id="leaveBtn">LEAVE</button>
    </div>

    <div class="messages" id="messages">
      <div class="empty-state" id="emptyState">
        <div class="glyph">◌</div>
        <p>No messages yet. Say something — everyone in this room sees it instantly.</p>
      </div>
    </div>
    <div class="typing-line" id="typingLine"></div>

    <div class="composer">
      <textarea class="composer-input" id="msgInput" placeholder="Message…" rows="1"></textarea>
      <button class="send-btn" id="sendBtn" aria-label="Send">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
      </button>
    </div>
  </div>
</div>

<script>
(function(){
  let socket = null;
  let myName = '';
  let roomCode = '';
  let messages = [];
  let typingTimeout = null;
  let roomKey = null;

  function setAppHeight(){
    var h = (window.visualViewport ? window.visualViewport.height : window.innerHeight);
    document.documentElement.style.setProperty('--app-height', h + 'px');
  }
  setAppHeight();
  window.addEventListener('resize', setAppHeight);
  if(window.visualViewport){ window.visualViewport.addEventListener('resize', setAppHeight); }

  // ---- End-to-end encryption (AES-256-GCM, key derived from the room code) ----
  // The server only ever sees ciphertext. Only phones that know the room code
  // can derive the key and read messages.
  async function deriveRoomKey(code){
    const enc = new TextEncoder();
    const keyMaterial = await crypto.subtle.importKey(
      'raw', enc.encode(code), { name: 'PBKDF2' }, false, ['deriveKey']
    );
    return await crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: enc.encode('nearline-fixed-salt-v1'), iterations: 150000, hash: 'SHA-256' },
      keyMaterial,
      { name: 'AES-GCM', length: 256 },
      false,
      ['encrypt', 'decrypt']
    );
  }
  function bufToB64(buf){
    return btoa(String.fromCharCode(...new Uint8Array(buf)));
  }
  function b64ToBuf(b64){
    return Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  }
  async function encryptText(key, text){
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const enc = new TextEncoder();
    const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, enc.encode(text));
    return bufToB64(iv) + '.' + bufToB64(ct);
  }
  async function decryptText(key, payload){
    try{
      const [ivB64, ctB64] = payload.split('.');
      const iv = b64ToBuf(ivB64);
      const ct = b64ToBuf(ctB64);
      const dec = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, ct);
      return new TextDecoder().decode(dec);
    }catch(e){
      return '🔒 [could not decrypt — wrong room key]';
    }
  }

  const $ = (id) => document.getElementById(id);
  const onboardScreen = $('onboardScreen');
  const chatScreen = $('chatScreen');
  const toast = $('toast');

  // Default server URL: same origin this page was loaded from (works out of the box
  // if this file is served BY the Node server itself). Editable otherwise.
  $('serverInput').value = window.location.origin.startsWith('http')
    ? window.location.origin
    : '';

  function showToast(text){
    toast.textContent = text;
    toast.classList.add('show');
    setTimeout(()=>toast.classList.remove('show'), 2600);
  }

  function setStatus(state, text){
    const dot = $('statusDot');
    dot.className = 'status-dot' + (state ? ' ' + state : '');
    $('statusText').textContent = text;
  }

  function randomCode(){
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    let out = '';
    for(let i=0;i<6;i++) out += chars[Math.floor(Math.random()*chars.length)];
    return out;
  }

  function initials(name){
    return (name||'').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase() || '?';
  }

  $('createBtn').addEventListener('click', () => {
    $('roomInput').value = randomCode();
  });

  $('joinBtn').addEventListener('click', async () => {
    const serverUrl = $('serverInput').value.trim().replace(/\/$/, '');
    const name = $('nameInput').value.trim();
    const room = $('roomInput').value.trim().toUpperCase();
    if(!serverUrl){ showToast('Enter your server URL'); $('serverInput').focus(); return; }
    if(!name){ showToast('Enter your name'); $('nameInput').focus(); return; }
    if(!room){ showToast('Enter or generate a room code'); $('roomInput').focus(); return; }

    myName = name;
    roomCode = room;
    setStatus('', 'connecting…');
    $('joinBtn').disabled = true;

    try{
      socket = io(serverUrl, { transports: ['websocket', 'polling'] });
    }catch(e){
      setStatus('bad', 'invalid server URL');
      $('joinBtn').disabled = false;
      return;
    }

    roomKey = await deriveRoomKey(roomCode);

    socket.on('connect', () => {
      setStatus('ok', 'connected');
      socket.emit('join_room', { name: myName, roomCode: roomCode });
      enterChat();
      $('joinBtn').disabled = false;
      $('encStatus').textContent = 'end-to-end encrypted';
    });

    socket.on('connect_error', (err) => {
      setStatus('bad', 'connection failed — check server URL / internet');
      $('joinBtn').disabled = false;
    });

    socket.on('disconnect', () => {
      setStatus('bad', 'disconnected');
      $('presenceText').textContent = 'reconnecting…';
    });

    socket.on('history', async (list) => {
      const decrypted = [];
      for(const m of (list || [])){
        decrypted.push({ ...m, text: await decryptText(roomKey, m.text) });
      }
      messages = decrypted;
      renderMessages();
    });

    socket.on('new_message', async (msg) => {
      const plain = { ...msg, text: await decryptText(roomKey, msg.text) };
      messages.push(plain);
      renderMessages();
    });

    socket.on('presence', (users) => {
      const count = users.length;
      $('presenceText').textContent = count <= 1
        ? 'only you here'
        : count + ' online · ' + users.filter(n=>n!==myName).slice(0,2).join(', ') + (count>3?'…':'');
    });

    socket.on('system_message', (text) => {
      const container = $('messages');
      const div = document.createElement('div');
      div.className = 'system-msg';
      div.textContent = text;
      container.appendChild(div);
      container.scrollTop = container.scrollHeight;
    });

    socket.on('peer_typing', ({name, isTyping}) => {
      $('typingLine').textContent = isTyping ? (name + ' is typing…') : '';
    });
  });

  $('leaveBtn').addEventListener('click', () => {
    if(socket){ socket.disconnect(); socket = null; }
    chatScreen.style.display = 'none';
    onboardScreen.style.display = 'flex';
    messages = [];
    setStatus('', 'not connected');
  });

  function enterChat(){
    onboardScreen.style.display = 'none';
    chatScreen.style.display = 'flex';
    $('myAvatar').textContent = initials(myName);
    $('roomLabel').textContent = roomCode;
  }

  function fmtTime(ts){
    const d = new Date(ts);
    return d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
  }

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function renderMessages(){
    const container = $('messages');
    if(!messages.length){
      container.innerHTML = '<div class="empty-state" id="emptyState"><div class="glyph">◌</div><p>No messages yet. Say something — everyone in this room sees it instantly.</p></div>';
      return;
    }
    let html = '';
    let lastSender = null;
    messages.forEach(m => {
      const mine = m.senderId === (socket ? socket.id : null);
      html += '<div class="msg-row ' + (mine?'mine':'') + '">';
      if(!mine) html += '<div class="msg-avatar">' + initials(m.sender) + '</div>';
      html += '<div class="bubble-wrap">';
      if(!mine && lastSender !== m.sender) html += '<span class="sender-name">' + escapeHtml(m.sender) + '</span>';
      html += '<div class="bubble">' + escapeHtml(m.text) + '</div>';
      html += '<span class="ts">' + fmtTime(m.ts) + '</span>';
